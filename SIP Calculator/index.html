<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIP Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <section class="calculator-card">
      <div class="card-header">
        <h1>SIP Calculator</h1>
        <p>Estimate how much your monthly investments can grow over time.</p>
      </div>

      <p id="error-message" class="error-message hidden" role="alert"></p>

      <form id="sip-form" class="calculator-form">
        <div class="field-group">
          <label for="monthly-investment">Monthly Investment</label>
          <input type="number" id="monthly-investment" min="1" step="1" placeholder="e.g. 5000" required>
        </div>

        <div class="field-group">
          <label for="annual-return">Expected Annual Return (%)</label>
          <input type="number" id="annual-return" min="0" step="0.01" placeholder="e.g. 12" required>
        </div>

        <div class="field-group">
          <label for="investment-duration">Investment Duration (Years)</label>
          <input type="number" id="investment-duration" min="1" step="0.1" placeholder="e.g. 10" required>
        </div>

        <div class="button-row">
          <button type="submit" class="btn btn-primary">Calculate</button>
          <button type="button" id="reset-btn" class="btn btn-secondary">Reset</button>
        </div>
      </form>

      <div id="result" class="result-panel hidden" aria-live="polite">
        <h2>Expected Maturity Value</h2>
        <div class="result-grid">
          <div class="result-item">
            <span class="label">Total Invested</span>
            <span id="total-invested" class="value">₹0</span>
          </div>
          <div class="result-item">
            <span class="label">Estimated Returns</span>
            <span id="estimated-returns" class="value">₹0</span>
          </div>
          <div class="result-item">
            <span class="label">Maturity Value</span>
            <span id="maturity-value" class="value">₹0</span>
          </div>
        </div>
        <p class="note">This estimate assumes a steady annual return and monthly investment.</p>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
